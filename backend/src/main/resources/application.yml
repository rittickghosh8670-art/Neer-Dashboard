spring:
  application:
    name: lbs-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:lbs_db}
    username: ${DB_USER:lbs_user}
    password: ${DB_PASSWORD:lbs_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  upload-dir: ${UPLOAD_DIR:../data/uploads}
  backup-dir: ${BACKUP_DIR:../data/backups}
  python-service-url: ${PYTHON_SERVICE_URL:http://localhost:8000}
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:lbs_db}
    user: ${DB_USER:lbs_user}
    password: ${DB_PASSWORD:lbs_password}

logging:
  level:
    com.lbs: INFO
